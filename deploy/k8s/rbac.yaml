# Namespace + ServiceAccount + Role + RoleBinding for in-cluster Jenkins
# deployment auth.
#
# Apply once from a laptop with admin kubeconfig:
#   kubectl apply -f deploy/k8s/rbac.yaml
#
# The Jenkins agent pod runs in this namespace (see Jenkinsfile agent block)
# under the blog-deployer ServiceAccount. kubectl in the pod uses the
# auto-mounted token — no external kubeconfig credential needed.
---
apiVersion: v1
kind: Namespace
metadata:
  name: blog
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blog-deployer
  namespace: blog
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blog-deployer
  namespace: blog
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blog-deployer
  namespace: blog
subjects:
  - kind: ServiceAccount
    name: blog-deployer
    namespace: blog
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: blog-deployer
