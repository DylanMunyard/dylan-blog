<!-- @dsCard group="Colors" viewport="700x150" name="Text & Semantic" subtitle="Text ladder and semantic tints" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px 20px;background:var(--bg-1);display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;align-content:center}.t{display:flex;justify-content:space-between;align-items:baseline}.t code{font:500 12px var(--font-mono);color:var(--fg-3);background:none;padding:0}.pill{font:500 13px var(--font-mono);padding:3px 10px;border-radius:var(--radius-full)}</style></head><body>
<div class="t"><span style="color:var(--fg-1);font:450 17px var(--font-body)">Primary body text</span><code>--fg-1</code></div>
<div class="t"><span class="pill" style="color:var(--info);background:var(--info-dim)">info</span><code>--info</code></div>
<div class="t"><span style="color:var(--fg-2);font:450 17px var(--font-body)">Secondary text</span><code>--fg-2</code></div>
<div class="t"><span class="pill" style="color:var(--warn);background:var(--warn-dim)">warn</span><code>--warn</code></div>
<div class="t"><span style="color:var(--fg-3);font:450 17px var(--font-body)">Muted metadata</span><code>--fg-3</code></div>
<div class="t"><span class="pill" style="color:var(--danger);background:var(--danger-dim)">danger</span><code>--danger</code></div>
</body></html>
