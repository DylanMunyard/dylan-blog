<!-- @dsCard group="Colors" viewport="700x150" name="Accents" subtitle="Azure lead + ember orange, on navy" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px;background:var(--bg-1);display:flex;gap:12px}.sw{flex:1;border-radius:var(--radius-md);padding:10px 12px;display:flex;flex-direction:column;justify-content:flex-end;height:110px}.sw b{font:600 13px var(--font-mono)}.sw span{font:400 11px var(--font-mono);opacity:0.7}</style></head><body>
<div class="sw" style="background:var(--accent);color:var(--accent-ink)"><b>--accent</b><span>#60a5fa azure</span></div>
<div class="sw" style="background:var(--accent-strong);color:#eaf1fb"><b>--accent-strong</b><span>#3b82f6 hover</span></div>
<div class="sw" style="background:var(--accent-dim);color:var(--accent);border:1px solid var(--line-1)"><b>--accent-dim</b><span>16% wash</span></div>
<div class="sw" style="background:var(--amber);color:#20120a"><b>--amber</b><span>#fb923c ember</span></div>
<div class="sw" style="background:var(--amber-dim);color:var(--amber);border:1px solid var(--line-1)"><b>--amber-dim</b><span>15% wash</span></div>
</body></html>
