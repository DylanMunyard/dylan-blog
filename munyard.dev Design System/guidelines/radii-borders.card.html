<div class="b" style="border-radius:var(--radius-sm)"><code>sm 6px</code></div>
<div class="b" style="border-radius:var(--radius-md)"><code>md 10px</code></div>

<div class="b" style="border-radius:var(--radius-full);height:44px;flex:0.8;align-items:center;justify-content:center;border-color:var(--line-2)"><code>pill</code></div>
