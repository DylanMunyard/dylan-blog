<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;height:220px;background:url('../assets/backgrounds/arch-qemu-header.jpg') center/cover;display:flex;align-items:center;justify-content:center}</style></head><body>
<div style="background:var(--scrim-content);backdrop-filter:blur(var(--scrim-blur));-webkit-backdrop-filter:blur(var(--scrim-blur));border:1px solid var(--line-1);border-radius:var(--radius-lg);padding:24px 32px;max-width:480px">
<div style="font:500 var(--text-xs) var(--font-mono);color:var(--accent);text-transform:uppercase;letter-spacing:var(--tracking-wide)">--scrim-content · blur 14px</div>
<p style="margin:8px 0 0;font:400 17px/1.6 var(--font-body);color:var(--fg-1)">Bespoke art stays fixed behind the page; prose scrolls over it on this scrim. Never set text on raw art.</p>
</div>
</body></html>
