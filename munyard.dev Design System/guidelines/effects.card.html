<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:var(--bg-1);display:flex;gap:20px;align-items:center}.c{flex:1;height:110px;background:var(--bg-2);border:1px solid var(--line-1);border-radius:var(--radius-lg);display:flex;align-items:flex-end;padding:12px}.c code{font:500 11px var(--font-mono);color:var(--fg-3);background:none;padding:0}</style></head><body>
<div class="c" style="box-shadow:var(--shadow-card)"><code>--shadow-card</code></div>
<div class="c" style="box-shadow:var(--shadow-raised);background:var(--bg-3)"><code>--shadow-raised</code></div>
<div class="c" style="box-shadow:var(--glow-accent)"><code>--glow-accent</code></div>
<div class="c" style="box-shadow:var(--ring-focus)"><code>--ring-focus</code></div>
</body></html>
